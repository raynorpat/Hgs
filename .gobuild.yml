filesets:
    includes:
        - conf
        - public
        - scripts
        - templates
        - LICENSE
        - README.md
    excludes:
        - \.hg
        - \.git
    depth: 5
settings:
        build: |
            if test "$GOOS" = "windows" -a "$GOARCH" = "386"
            then
                go install -v
            else
                go get -v -tags "redis memcache cert" github.com/gogits/gogs
                go install -v -tags "redis memcache cert"
            fi

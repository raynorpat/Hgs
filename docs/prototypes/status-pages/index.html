<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maintenance · Hgs status preview</title>
<style>
:root{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b4d;background:#fff;--primary:#0052cc;--muted:#5e6c84;--border:#dfe1e6}*{box-sizing:border-box}body{margin:0}button,a,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:var(--primary);text-decoration:none}a:hover{text-decoration:underline}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffab00;outline-offset:4px}[hidden]{display:none!important}.wrap{width:min(1120px,calc(100% - 80px));margin:auto}.study{background:#f4f5f7;border-bottom:1px solid var(--border);padding:10px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.study strong{letter-spacing:.07em;color:#172b4d;font-size:11px}.view-switch{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}.view-switch button{border:0;border-radius:3px;background:none;color:#42526e;padding:6px 11px}.view-switch button[aria-pressed=true]{background:#deebff;color:#0747a6;font-weight:600}.study label{display:flex;align-items:center;gap:5px;font-size:11px}.header{height:94px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ebecf0}.identity{display:flex;align-items:center;gap:12px;color:#172b4d;background:none;border:0;padding:0}.identity .mark{width:29px;height:34px;color:#0052cc}.wordmark{font-size:29px;font-weight:700;letter-spacing:-1px}.wordmark b{color:#0052cc}.descriptor{font-size:12px;color:var(--muted);border-left:1px solid var(--border);padding-left:15px;margin-left:4px}.help-link{color:#42526e;border:0;background:none;padding:8px 0;display:flex;align-items:center;gap:7px}.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.hero{min-height:calc(100vh - 270px);display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:50px;padding:64px 0 58px}.copy{max-width:570px}.eyebrow{display:flex;align-items:center;gap:10px;color:#5e6c84;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;margin:0 0 19px}.code{display:inline-block;border:1px solid #b3d4ff;border-radius:4px;background:#f0f5ff;color:#0747a6;padding:2px 7px;font:600 12px/1.6 ui-monospace,Consolas,monospace;letter-spacing:0}h1{font-size:46px;line-height:1.15;letter-spacing:-1.7px;font-weight:650;margin:0 0 22px;max-width:550px}.lead{font-size:17px;line-height:1.8;color:#42526e;max-width:470px;margin:0 0 26px}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.button{min-height:42px;border:1px solid transparent;border-radius:4px;padding:9px 17px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:600;background:#0052cc;color:white;font-size:14px}.button:hover{background:#0747a6}.button.secondary{background:#f4f5f7;color:#172b4d;border-color:#dfe1e6}.button.secondary:hover{background:#ebecf0}.note{font-size:12px;color:var(--muted);margin-top:20px;line-height:1.7;max-width:440px}.request{margin-top:22px;padding-top:18px;border-top:1px solid #ebecf0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}.request code{font:12px ui-monospace,Consolas,monospace;color:#42526e}.copy-id{padding:3px 6px;border:0;border-radius:3px;background:#f4f5f7;color:#0052cc;font-size:11px}.art{margin:0;display:flex;justify-content:center;align-items:center;min-width:0}.art img{width:100%;height:405px;max-width:410px;object-fit:contain;display:block}.notice{margin-top:20px;padding:12px 16px;border:1px solid #b3d4ff;background:#f0f5ff;border-radius:4px;color:#0747a6;font-size:13px;max-width:470px}.footer{border-top:1px solid var(--border);padding:23px 0 27px;display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:11px}.footer p{margin:0 0 4px}.footer strong{font-size:12px;font-weight:500;color:#42526e}.credits{text-align:right;max-width:480px}.credits a{color:#5e6c84;text-decoration:underline}.compare{padding:40px 0 55px}.compare h1{font-size:30px;margin-bottom:10px;letter-spacing:-.8px}.compare-intro{color:#5e6c84;margin:0 0 26px;font-size:14px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{padding:25px 23px;border:1px solid var(--border);border-radius:5px;display:flex;flex-direction:column;align-items:flex-start}.card img{width:100%;height:245px;object-fit:contain;margin:4px 0 27px}.card h2{font-size:21px;line-height:1.3;letter-spacing:-.4px;margin:15px 0 10px}.card p{font-size:13px;color:#42526e;margin:0 0 22px;line-height:1.75}.card .button{margin-top:auto;min-height:38px;padding:7px 12px;font-size:12px}.card .eyebrow{margin:0;font-size:10px}.no-art .art{display:none}.no-art .hero{grid-template-columns:1fr;min-height:calc(100vh - 270px)}.no-art .copy{max-width:650px}.no-art .card img{display:none}dialog{width:min(500px,calc(100% - 32px));padding:28px;border:1px solid var(--border);border-radius:6px;color:#172b4d;box-shadow:0 8px 30px #091e4233}dialog::backdrop{background:#091e4266}dialog h2{font-size:23px;margin:0 0 16px;letter-spacing:-.5px}dialog p{font-size:14px;color:#42526e;line-height:1.8}dialog .close{float:right;border:0;background:#f4f5f7;border-radius:3px;padding:4px 10px;margin-left:12px}.help-line{padding:12px 0;border-top:1px solid #ebecf0}.help-line strong{display:block;font-size:13px}.help-line p{margin:4px 0;font-size:13px}.skip{position:absolute;left:-9999px}.skip:focus{left:15px;top:15px;background:white;padding:10px;z-index:4}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:800px){.wrap{width:calc(100% - 40px)}.study{gap:8px;padding:9px 12px}.study .study-note{display:none}.view-switch{margin-left:0}.view-switch button{padding:6px 9px}.header{height:75px}.descriptor{display:none}.hero{padding:30px 0 40px;grid-template-columns:1fr;gap:25px;min-height:0}.art{grid-row:1}.art img{height:230px;max-width:300px}.copy{max-width:none}.eyebrow{margin-bottom:14px;font-size:11px}h1{font-size:36px;letter-spacing:-1.15px;margin-bottom:18px}.lead{font-size:15px;margin-bottom:23px}.note{font-size:11px}.footer{flex-direction:column;gap:10px}.credits{text-align:left}.cards{grid-template-columns:1fr}.card{padding:24px}.card img{height:230px}.compare{padding-top:30px}.no-art .hero{min-height:440px}.button{min-height:44px}.help-link{font-size:13px}.wordmark{font-size:27px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body data-asset-base="./">
<a class="skip" href="#main">Skip to content</a>
<div class="study"><strong>STATUS PAGE STUDY</strong><span class="study-note">Interactive prototype · no server changes</span><div class="view-switch" aria-label="Preview page"><button data-page="503" aria-pressed="true">Maintenance</button><button data-page="500" aria-pressed="false">500 error</button><button data-page="404" aria-pressed="false">404 not found</button><button data-page="compare" aria-pressed="false">Compare all</button></div><label><input type="checkbox" id="hide-art">Hide illustrations</label></div>
<header class="wrap header"><button class="identity" data-action="home" aria-label="Hgs home"><svg class="mark" viewBox="0 0 30 34" fill="none" aria-hidden="true"><path d="M5 4h20l-2 4v21a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V8z" stroke="currentColor" stroke-width="2"/><path d="M8 19c4-3 9 3 14 0v10H8z" fill="#00b8d9" opacity=".45"/><path d="M18 12h4m-3 5h3m-4 6h4" stroke="currentColor" stroke-width="2"/></svg><span class="wordmark">Hgs<b>.</b></span><span class="descriptor">Mercurial service</span></button><button class="help-link" data-action="help"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 8a3 3 0 1 1 4 3l-1 1v2m0 3h.01"/></svg>Help</button></header>
<main class="wrap" id="main" tabindex="-1"></main>
<footer class="wrap footer"><div><p><strong>A painless, self-hosted Mercurial service.</strong></p><p>Hgs · Based on Gogs. Existing copyright and license notices apply.</p></div><div class="credits"><p>Go Gopher by <a href="https://go.dev/blog/gopher">Renee French</a> · <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></p><p>Hardhat, laboratory and searching adaptations · Design preview</p></div></footer>
<dialog id="help-dialog" aria-labelledby="dialog-title"><button class="close" id="close-dialog" aria-label="Close dialog">✕</button><div id="dialog-body"></div></dialog>
<script>
const pages={
'503':{name:'Maintenance',label:'Service maintenance',title:"We'll be back soon.",description:"We're making a few improvements to Hgs. The service is temporarily unavailable while we work.",image:'hgs-maintenance.png',primary:'Check again',action:'check',note:'Please check back in a few minutes. Thank you for your patience.'},
'500':{name:'500 error',label:'Internal server error',title:'Something went wrong.',description:"An unexpected error prevented us from completing your request. You can return to the home page or get help.",image:'hgs-error.png',primary:'Go to home',action:'home',note:"If you were submitting a form, check whether it succeeded before trying again."},
'404':{name:'404 not found',label:'Page not found',title:"We couldn't find that page.",description:"The page may have moved, or you may not have access to it. Check the address or return to the home page.",image:'hgs-not-found.png',primary:'Go to home',action:'home',note:"If you followed a saved link, it may no longer be available."}
};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let selected=['503','500','404','compare'].includes(location.hash.slice(1))?location.hash.slice(1):'503',lastTrigger;
const assets=document.body.dataset.assetBase;
const arrow='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>';
const refresh='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 13 3M5 15a8 8 0 0 0 13 3"/></svg>';
function render(focus=false){
$$('[data-page]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.page===selected));
document.title=(selected==='compare'?'Status pages':pages[selected].name)+' · Hgs design preview';
if(selected==='compare'){
$('#main').innerHTML='<section class="compare"><h1>A little help when things go sideways.</h1><p class="compare-intro">One familiar Gopher, three situations. Select a page to review the full layout.</p><div class="cards">'+Object.entries(pages).sort((a,b)=>['503','500','404'].indexOf(a[0])-['503','500','404'].indexOf(b[0])).map(([code,p])=>'<article class="card"><img src="'+assets+p.image+'" alt=""><p class="eyebrow"><span class="code">'+code+'</span>'+p.label+'</p><h2>'+p.title+'</h2><p>'+p.description+'</p><button class="button secondary" data-page="'+code+'">Review '+p.name.toLowerCase()+' '+arrow+'</button></article>').join('')+'</div></section>';
}else{const p=pages[selected];$('#main').innerHTML='<section class="hero" aria-labelledby="page-title"><div class="copy"><p class="eyebrow"><span class="code">'+selected+'</span>'+p.label+'</p><h1 id="page-title">'+p.title+'</h1><p class="lead">'+p.description+'</p><div class="actions"><button class="button" data-action="'+p.action+'">'+p.primary+(p.action==='check'?refresh:arrow)+'</button><button class="button secondary" data-action="help">Get help</button></div><p class="note">'+p.note+'</p>'+(selected==='500'?'<div class="request"><span>Reference ID</span><code id="request-id">hgs-demo-7f2c9a</code><button class="copy-id" data-action="copy">Copy</button><span class="sr-only" id="copy-status" role="status"></span></div>':'')+'<div id="feedback" class="notice" role="status" hidden></div></div><figure class="art"><img src="'+assets+p.image+'" alt="" width="1024" height="1024"></figure></section>'}
$$('#main img').forEach(img=>img.addEventListener('error',()=>{img.hidden=true}));
if(focus)$('#main').focus({preventScroll:true});
}
function dialog(action,trigger){lastTrigger=trigger;$('#dialog-body').innerHTML=action==='help'?'<h2 id="dialog-title">A little help</h2><div class="help-line"><strong>During maintenance</strong><p>Wait a few minutes, then use Check again. Repositories and account actions will become available when maintenance ends.</p></div><div class="help-line"><strong>If something went wrong</strong><p>Try the home page. If the problem continues, contact your instance administrator and include the reference ID, if one is shown.</p></div><div class="help-line"><strong>If a page is missing</strong><p>Check the address. Ask the repository owner for the current link and confirm that your account has access.</p></div><p class="note">This is a local design preview. No server status or account data is being checked.</p>':'<h2 id="dialog-title">Home destination preview</h2><p>In Hgs, this link returns to the configured application root. This prototype keeps you here so you can review all three status pages.</p><p class="note">Maintenance mode and error responses have not been enabled on any server.</p>';$('#help-dialog').showModal()}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){selected=b.dataset.page;history.replaceState(null,'','#'+selected);render();return}const action=b.dataset.action;if(action==='help'||action==='home'){dialog(action,b);return}if(action==='check'){const feedback=$('#feedback');feedback.hidden=false;feedback.textContent='Preview: the service is still undergoing maintenance. No request was retried.';return}if(action==='copy'){try{await navigator.clipboard.writeText($('#request-id').textContent);b.textContent='Copied';$('#copy-status').textContent='Reference ID copied.'}catch{$('#copy-status').textContent='Copy unavailable. Select the reference ID to copy it.';const range=document.createRange();range.selectNodeContents($('#request-id'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range)}}});
$('#hide-art').onchange=e=>document.body.classList.toggle('no-art',e.target.checked);
$('#close-dialog').onclick=()=>$('#help-dialog').close();$('#help-dialog').addEventListener('close',()=>lastTrigger?.focus());
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);if(['503','500','404','compare'].includes(next)){selected=next;render()}});
render();
</script></body></html>

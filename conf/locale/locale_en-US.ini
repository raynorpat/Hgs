[help]
intro = Hgs hosts Mercurial repositories and keeps source, issues, and pull requests together.
browse_title = Find your way around a repository
browse = Source shows files at a changeset. Changesets shows history; Branches lets you choose named branches, bookmarks, and tags. Full changeset IDs identify immutable revisions, while bookmarks can move and named branches can have several heads.
clone_title = Work with Mercurial
clone = Open a repository you can read and use Clone to copy its configured hg clone command. Run that command locally to create your working copy.
http = Use the HTTP or HTTPS address shown by Clone. Private repositories require your account credentials; authenticated access and pushes require a secure connection. The configured address determines the protocol.
ssh = SSH is also enabled on this instance. Use the SSH address from Clone and add a public key to your account. Your key identifies your account; repository permissions still apply.
local = Inside your local working copy, pull new changes and update before editing. Inspect your changes, add new files, commit, and push when you have write access. These are separate commands; inspect each result before continuing.
write_access = Read access permits cloning and pulling. Pushing requires write access. Keep published history intact; inspect and resolve divergent heads locally before publishing.
discuss_title = Discuss and follow work
discuss = Use Issues for questions and tasks. Pull requests compare changes in related repositories and support discussion and review. Resolve conflicts locally with Mercurial before refreshing the comparison.
watch_star = Watch controls existing repository subscriptions. Star is an independent way to mark a repository for yourself. Sign in to change either preference.
documentation = Official Mercurial guide


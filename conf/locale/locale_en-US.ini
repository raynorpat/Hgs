needs_review = Needs your review
unknown = The saved outcome could not be confirmed. Your input is retained. Check the current saved pull request before submitting anything again.
strategy_fast_forward = Fast-forward: preserve source changesets and advance this exact destination to the source node. No merge changeset is created; only the selected destination bookmark may move.
strategy_two_parent = Two-parent merge: preserve source changesets and create a native Mercurial merge changeset on the destination branch, with the exact target as first parent and source as second parent. Conflicts require local resolution.
strategy_already_integrated = Already integrated: acknowledge this exact comparison without creating a changeset or moving unrelated references.
awaiting_review = Awaiting review
status_unprepared = No comparison has been prepared yet. Use Refresh comparison to compare the selected references. No preparation is running.

